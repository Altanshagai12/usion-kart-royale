<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so env(safe-area-inset-*) reports real values on
         notched phones. maximum-scale/user-scalable are kept for the engines
         that still honour them, but iOS Safari has ignored them since iOS 10 —
         the `touch-action: none` below is what actually stops pinch-zoom, along
         with the gesture handlers in src/core/Input.ts. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Kart Royale</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: #05070d;
        /* the page is a game surface, not a document: no panning, no pinch,
           no double-tap zoom, no pull-to-refresh, no long-press callout */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        position: fixed; inset: 0;
      }
      body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
      body {
        --kr-safe-top: env(safe-area-inset-top, 0px);
        --kr-safe-right: env(safe-area-inset-right, 0px);
        --kr-safe-bottom: env(safe-area-inset-bottom, 0px);
        --kr-safe-left: env(safe-area-inset-left, 0px);
      }
      /*
       * Usion's mobile WebView is portrait-locked. Give the game a real logical
       * landscape surface inside that portrait frame instead of asking for an
       * orientation change the host cannot perform. Rotating body also carries
       * every dynamically-mounted HUD/control/overlay with the canvas.
       */
      @media (orientation: portrait) {
        body {
          inset: auto;
          top: 50%; left: 50%;
          width: 100vh; height: 100vw;
          transform: translate(-50%, -50%) rotate(90deg);
          transform-origin: center;
          --kr-safe-top: env(safe-area-inset-right, 0px);
          --kr-safe-right: env(safe-area-inset-bottom, 0px);
          --kr-safe-bottom: env(safe-area-inset-left, 0px);
          --kr-safe-left: env(safe-area-inset-top, 0px);
        }
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>

    <!-- Painted on the very first frame, before a single module has parsed, so
         the tab is never an unexplained black rectangle. main.ts advances it as
         each system initialises and removes it once the first real frame is up.
         Building a WebGL scene of this size takes a few seconds — the sky is
         raymarched into a PMREM probe, every texture is generated procedurally
         and every shader is compiled up front — and silence during that reads
         as a hang. -->
    <div id="boot">
      <div class="boot-in">
        <div class="boot-mark">KART<span>ROYALE</span></div>
        <div class="boot-bar"><i></i></div>
        <div class="boot-step">starting up</div>
      </div>
    </div>
    <style>
      #boot {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background:
          radial-gradient(120% 90% at 50% 8%, #2c3560 0%, #141a33 42%, #080b16 100%);
        color: #f3f6fb; transition: opacity .55s ease; font-family: system-ui, -apple-system, sans-serif;
      }
      #boot.done { opacity: 0; pointer-events: none; }
      .boot-in { display: flex; flex-direction: column; align-items: center; gap: 3.4vmin; }
      .boot-mark {
        font-size: 8.2vmin; font-weight: 900; letter-spacing: .1em; line-height: .96;
        display: flex; flex-direction: column; align-items: center;
        background: linear-gradient(180deg, #fff 12%, #ffd27a 58%, #f0a23c 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 3px 10px rgba(0,0,0,.55));
      }
      .boot-mark span { font-size: .52em; letter-spacing: .38em; margin-left: .38em; }
      .boot-bar {
        width: 42vmin; max-width: 380px; height: 5px; border-radius: 999px;
        background: rgba(255,255,255,.13); overflow: hidden;
      }
      .boot-bar i {
        display: block; width: 0%; height: 100%; border-radius: 999px;
        background: linear-gradient(90deg, #6ad2ff, #ffd27a);
        transition: width .3s ease; box-shadow: 0 0 12px rgba(255,200,120,.7);
      }
      .boot-step {
        font-size: 2.5vmin; letter-spacing: .22em; text-transform: uppercase;
        color: rgba(233,240,250,.62); min-height: 1.2em;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot, .boot-bar i { transition: none; }
      }
    </style>
    <script src="https://usions.com/usion-sdk.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
